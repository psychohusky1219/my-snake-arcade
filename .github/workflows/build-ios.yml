name: Build native iPhone app

on:
  push:
    branches: [main]
    paths:
      - 'iOS/**'
      - 'Web/**'
      - 'scripts/test-web.mjs'
      - 'scripts/build-ios.sh'
      - '.github/workflows/build-ios.yml'
      - 'docs/INSTALL-WINDOWS.md'
      - 'docs/RELEASE-NOTES.md'
  workflow_dispatch:

# No Apple credentials or custom secrets are needed.
permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    # Standard public runners are free; refuse private-repository builds.
    # Only reviewed code on main is eligible; PRs cannot publish releases.
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Show build tools
        run: |
          xcodebuild -version
          swift --version

      - name: Test game engine and compile unsigned device app
        run: bash scripts/build-ios.sh

      - name: Publish unsigned personal-installation package
        # Only this release step exposes the short-lived token in its environment.
        # Use Release assets rather than billable Actions artifact/cache storage.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="native-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          url="$(gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "My Snake - unsigned iPhone build ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes-file docs/RELEASE-NOTES.md \
            dist/MySnake-unsigned.ipa dist/SHA256SUMS.txt \
            dist/INSTALL-WINDOWS.md dist/BUILD-INFO.txt)"
          {
            echo '## Native build succeeded'
            echo
            echo "[Download the unsigned iPhone app]($url)"
            echo
            echo 'This is a native device binary, not an App Store release.'
            echo 'It must be signed for your own iPhone before installation.'
            echo 'No Apple account credentials were used by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
